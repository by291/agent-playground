[project]
name = "agent-playground"
version = "0.2.0"
description = "A small LangChain agent served by Aegra"
requires-python = ">=3.12,<3.14"
dependencies = [
  "a2a-sdk[http-server]==1.2.2",
  "a2ui-core>=0.2.0,<0.3.0",
  "aegra-cli",
  "async-lru>=2.3.0",
  "charset-normalizer>=3.5.2,<4",
  "fastapi>=0.142.4",
  "httpx>=0.28.1",
  "langchain",
  "langchain-core>=1.6.7",
  "langchain-deepseek>=1.1.1",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-openai>=1.6.7",
  "langchain-postgres>=0.0.19,<0.1",
  "langchain-qwq>=0.3.5",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1.2.14",
  "langgraph-checkpoint-postgres",
  "langmem>=0.0.30,<0.1",
  "limits>=5.8,<6",
  "mcp>=1.30.0,<2",
  "openai>=3.26.1,<4",
  "opensandbox>=1.1.0,<1.2",
  "opentelemetry-api>=1.45.1",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.13.5",
  "pypdf>=6,<7",
  "pyyaml>=6,<7",
  "redis>=8.1,<9",
  "sqlalchemy>=2.1.4",
  "sqlglot>=30.21.0",
  "structlog>=26.1.0",
]

[project.scripts]
agent = "agent_playground.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest",
    "ruff",
    "testcontainers[postgres]>=4.15.0",
    "types-protobuf>=7.35.1.20260906",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires isolated Docker services"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pyrefly]
project-includes = ["agent_playground", "tests"]
preset = "strict"
