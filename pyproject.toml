[project]
name = "agent-playground"
version = "0.2.0"
description = "A small LangChain agent served by Aegra"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aegra-cli",
  "langchain",
  "langchain-openai",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]",
]

[project.scripts]
agent = "agent_playground.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyrefly]
project-includes = ["agent_playground", "tests"]
