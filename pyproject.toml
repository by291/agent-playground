[project]
name = "agent-playground"
version = "0.2.0"
description = "A small LangChain agent served by Aegra"
requires-python = ">=3.12,<3.14"
dependencies = [
  "a2ui-core>=0.1.1,<0.2.0",
  "aegra-cli",
  "langchain",
  "langchain-core>=1.6.4",
  "langchain-deepseek>=1.1.1",
  "langchain-mcp-adapters>=0.3.2",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-postgres",
  "mcp>=1.30.0",
  "pydantic>=2.13.5",
]

[project.scripts]
agent = "agent_playground.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest",
    "ruff",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pyrefly]
project-includes = ["agent_playground", "tests"]
preset = "strict"
