name: Android dependency graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Submit Android dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Submitting a snapshot requires write access; this job runs on main only.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - name: Resolve and submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android
          dependency-graph: generate-and-submit
          cache-provider: basic
          additional-arguments: --no-daemon --console=plain
