name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run pyrefly check
        if: runner.os == 'Linux'
      - run: uv run ruff check .
        if: runner.os == 'Linux'
      - run: uv run ruff format --check .
        if: runner.os == 'Linux'
      - name: Run Python tests including container integration
        if: runner.os == 'Linux'
        run: uv run pytest
      - name: Run Python tests without container services
        if: runner.os == 'Windows'
        run: uv run pytest -m "not integration"

  server:
    name: Server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm --filter agent-playground-server check
      - run: pnpm --filter agent-playground-server lint
      - run: pnpm --filter agent-playground-server test:unit
      - run: pnpm --filter agent-playground-server test:integration
        if: runner.os == 'Linux'
      - name: Install GNU Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress --yes
      - run: pnpm test:dev

  web:
    name: Web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm format:check
        if: runner.os == 'Linux'
      - run: pnpm --filter agent-playground-web check
      - run: pnpm --filter agent-playground-web lint
      - run: pnpm --filter agent-playground-web test
      - run: pnpm --filter agent-playground-web build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm --filter agent-playground-web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter agent-playground-web exec playwright test
      - name: Publish browser runtime summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f web/test-results/runtime.md ]; then
            cat web/test-results/runtime.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
      - name: Cache Gradle dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-
      - name: Check formatting, lint, tests and builds
        run: ./gradlew qualityCheck --no-daemon --console=plain
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 14
