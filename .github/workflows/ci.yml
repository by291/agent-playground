name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run pyrefly check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm --filter agent-playground-server check
      - run: pnpm --filter agent-playground-server lint
      - run: pnpm --filter agent-playground-server test
      - run: pnpm test:dev

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm --filter agent-playground-web check
      - run: pnpm --filter agent-playground-web lint
      - run: pnpm --filter agent-playground-web test
      - run: pnpm --filter agent-playground-web build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm --filter agent-playground-web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter agent-playground-web exec playwright test
      - name: Publish browser runtime summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f web/test-results/runtime.md ]; then
            cat web/test-results/runtime.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
