include:
  - infra/observability/compose.yaml

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_playground
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_playground"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  skill-sandbox:
    image: opensandbox/server:release-1.1.1-rc.1
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${SKILL_SANDBOX_API_KEY:-agent-playground-local-sandbox}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - skill_sandbox_data:/var/lib/opensandbox
      - ./infra/skills/sandbox.toml:/etc/opensandbox/config.toml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  skill-storage:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-bucket=agent-skills", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - skill_storage_data:/data
      - ./infra/skills/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  skill_sandbox_data:
  skill_storage_data:
