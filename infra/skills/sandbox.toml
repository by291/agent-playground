[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 1200

[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.1.1-rc.1"

[docker]
network_mode = "bridge"
publish_host = "127.0.0.1"
host_ip = "host.docker.internal"
port_range_min = 20000
port_range_max = 29999
pids_limit = 256
no_new_privileges = true
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]

[store]
type = "sqlite"
path = "/var/lib/opensandbox/state.db"

[storage]
allowed_host_paths = ["/nonexistent-skill-mounts"]

[egress]
image = "opensandbox/egress:release-1.1.1-rc.1"
mode = "dns"
